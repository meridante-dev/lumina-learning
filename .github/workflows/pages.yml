name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # THE GATE. Nothing reaches a learner until this is green.
  #
  # Until now this workflow was the only CI, and it only knew how to deploy —
  # a broken push went straight to academy.edenrise.com. `node --check` was the
  # whole safety net, and it happily passes a clobbered event handler, a raw
  # i18n key rendered at the user, a ?v= marker out of step with sw.js, or a
  # Vimeo id that has been deleted upstream. All four have happened.
  #
  # Runs on its own fresh checkout, BEFORE the minify step rewrites files in
  # place, so it tests the source that is actually committed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Suite (integrity + units + harness self-test)
        run: node test/run.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10        # a hung deploy fails fast instead of holding the concurrency slot for hours
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # esbuild is installed ONCE. This step used to call `npx --yes esbuild@0.24.2`
      # nine times, each resolving the package fresh on a clean runner; a slow or
      # flaky registry stalled it — six minutes and counting on a step that takes
      # thirty seconds, with GitHub reporting all systems operational.
      - name: Install esbuild
        run: npm i -g esbuild@0.24.2
      - name: Minify JS + CSS (deploy artifact only; source stays readable)
        run: |
          esbuild brands/edenrise/brand.js --minify --charset=utf8 --outfile=brands/edenrise/brand.js --allow-overwrite
          esbuild brands/_example/brand.js --minify --charset=utf8 --outfile=brands/_example/brand.js --allow-overwrite
          esbuild core/brandkit.js --minify --charset=utf8 --outfile=core/brandkit.js --allow-overwrite
          esbuild core/app.js  --minify --charset=utf8 --outfile=core/app.js  --allow-overwrite
          esbuild brands/edenrise/content.js --minify --charset=utf8 --outfile=brands/edenrise/content.js --allow-overwrite
          esbuild data.js --minify --charset=utf8 --outfile=data.js --allow-overwrite
          esbuild core/auth.js --minify --charset=utf8 --format=esm --outfile=core/auth.js --allow-overwrite
          esbuild sw.js   --minify --charset=utf8 --outfile=sw.js   --allow-overwrite
          esbuild core/styles.css --minify --outfile=core/styles.css --allow-overwrite
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
